  <!-- ===== Salesforce Calendar Event integration (added) ===== -->
  <!-- Populates the "Event", "Event 2", and "Event 3" dropdowns from the
       CVSR__CalendarEvent__c Cloudflare Worker API (PRODUCTION). This form has
       no separate EventID fields, so each dropdown's own submitted value IS
       the Salesforce record Id (the option value), while the Name is shown to
       the user as the option text. -->
  <script>
  (function () {
    // Production Worker (deployed via wrangler-prod.toml)
    var API_URL = 'https://sf-calendar-events-prod.seiu-usww.workers.dev';

    var selectIds = ['input_29', 'input_30', 'input_31'];

    function populateSelect(select, events) {
      var current = select.value;
      select.innerHTML = '';

      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Please Select';
      placeholder.selected = true;
      select.appendChild(placeholder);

      events.forEach(function (ev) {
        var opt = document.createElement('option');
        opt.value = ev.id;          // Salesforce record Id (submitted as the dropdown's value)
        opt.textContent = ev.name;  // Event Name (shown to the user)
        select.appendChild(opt);
      });

      if (current) select.value = current;
    }

    fetch(API_URL)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var events = data.events || [];

        selectIds.forEach(function (id) {
          var select = document.getElementById(id);
          if (!select) return;
          populateSelect(select, events);
        });
      })
      .catch(function (err) {
        console.error('Failed to load Salesforce Calendar Events:', err);
      });
  })();
  </script>
  <!-- ===== end Salesforce Calendar Event integration ===== -->
